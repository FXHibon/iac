services:
  node-exporter:
    image: prom/node-exporter:v1.11.1
    container_name: node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - proxy

  prometheus:
    image: prom/prometheus:v3.12.0
    container_name: prometheus
    restart: unless-stopped
    user: "1000:1000"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      # Expose Prometheus securely in HTTPS
      - "traefik.http.routers.prometheus.entrypoints=websecure"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.fxhibon.fr`)"
      - "traefik.http.routers.prometheus.service=prometheus"
      - "traefik.http.routers.prometheus.tls=true"
      - "traefik.http.routers.prometheus.tls.certresolver=myresolver"
      # Restriction: IP AllowList (Home IP) + Basic Auth (reusing Traefik admin hash)
      - "traefik.http.routers.prometheus.middlewares=prometheus-ipallowlist,prometheus-auth"
      - "traefik.http.middlewares.prometheus-ipallowlist.ipallowlist.sourcerange={{ current_home_ip }}/32,127.0.0.1/32"
      - "traefik.http.middlewares.prometheus-auth.basicauth.users=admin:$$apr1$$16gt8564$$TIPmccK4/8STTOTgRtpVr/"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"

  grafana:
    image: grafana/grafana:13.0.1
    container_name: grafana
    restart: unless-stopped
    user: "1000"
    volumes:
      - ./grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning/datasources/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./config/grafana/provisioning/dashboards/dashboard.yml:/etc/grafana/provisioning/dashboards/dashboard.yml:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      # Expose Grafana securely in HTTPS
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.rule=Host(`grafana.fxhibon.fr`)"
      - "traefik.http.routers.grafana.service=grafana"
      - "traefik.http.routers.grafana.tls=true"
      - "traefik.http.routers.grafana.tls.certresolver=myresolver"
      # Restriction: IP AllowList (Home IP)
      - "traefik.http.routers.grafana.middlewares=grafana-ipallowlist"
      - "traefik.http.middlewares.grafana-ipallowlist.ipallowlist.sourcerange={{ current_home_ip }}/32,127.0.0.1/32"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

  docker-stats-exporter:
    image: wywywywy/docker_stats_exporter:20220516
    container_name: docker-stats-exporter
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - proxy

  loki:
    image: grafana/loki:3.7.2
    container_name: loki
    restart: unless-stopped
    user: "1000"
    volumes:
      - ./config/loki/loki.yml:/etc/loki/loki.yml:ro
      - ./loki-data:/loki
    command: -config.file=/etc/loki/loki.yml
    networks:
      - proxy

  alloy:
    image: grafana/alloy:v1.16.1
    container_name: alloy
    restart: unless-stopped
    user: root
    volumes:
      - ./config/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: run --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    networks:
      - proxy



networks:
  proxy:
    external: true
