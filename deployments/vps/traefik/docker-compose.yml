services:
  traefik:
    image: traefik:3.7
    container_name: traefik
    command:
      - "--configfile=/traefik.yml"
    restart: always
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro # Pour écouter Docker
      - ./data/traefik.yml:/traefik.yml:ro           # Config statique
      - ./data/acme.json:/acme.json                  # Stockage des certifs SSL
      - ./logs:/var/log/traefik                      # Dossier partagé pour les logs d'accès
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      # Exposer le dashboard en HTTPS
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.fxhibon.fr`)"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.routers.dashboard.tls.certresolver=myresolver"
      # Restriction d'accès par IP (IPAllowList) + Basic Auth + Rate Limit + CrowdSec
      - "traefik.http.routers.dashboard.middlewares=global-ratelimit,crowdsec-bouncer,dashboard-ipallowlist,dashboard-auth"
      - "traefik.http.middlewares.dashboard-ipallowlist.ipallowlist.sourcerange={{ current_home_ip }}/32,127.0.0.1/32"
      - "traefik.http.middlewares.dashboard-auth.basicauth.users=admin:$$apr1$$16gt8564$$TIPmccK4/8STTOTgRtpVr/"

      # Middleware : RateLimit global (30 req/s moyenne, burst à 100)
      - "traefik.http.middlewares.global-ratelimit.ratelimit.average=30"
      - "traefik.http.middlewares.global-ratelimit.ratelimit.burst=100"

      # Middleware : CrowdSec Bouncer (Vérifie les requêtes en temps réel auprès de CrowdSec LAPI)
      - "traefik.http.middlewares.crowdsec-bouncer.plugin.crowdsec-bouncer.enabled=true"
      - "traefik.http.middlewares.crowdsec-bouncer.plugin.crowdsec-bouncer.crowdseclapiurl=http://crowdsec:8080/"
      - "traefik.http.middlewares.crowdsec-bouncer.plugin.crowdsec-bouncer.crowdseclapikey=${CROWDSEC_BOUNCER_KEY}"
      - "traefik.http.middlewares.crowdsec-bouncer.plugin.crowdsec-bouncer.updateIntervalSeconds=10"
      - "traefik.http.middlewares.crowdsec-bouncer.plugin.crowdsec-bouncer.defaultDecisionSeconds=3600"

      # Global block for sensitive paths (/metrics and /_health)
      - "traefik.http.routers.block-paths.entrypoints=websecure"
      - "traefik.http.routers.block-paths.rule=PathPrefix(`/metrics`) || PathPrefix(`/_health`)"
      - "traefik.http.routers.block-paths.priority=10000"
      - "traefik.http.routers.block-paths.service=api@internal"
      - "traefik.http.routers.block-paths.tls=true"
      - "traefik.http.routers.block-paths.tls.certresolver=myresolver"
      - "traefik.http.routers.block-paths.middlewares=block-paths-ipallowlist"
      - "traefik.http.middlewares.block-paths-ipallowlist.ipallowlist.sourcerange=127.0.0.1/32"

  crowdsec:
    image: crowdsecurity/crowdsec:v1.8.0
    container_name: crowdsec
    restart: always
    environment:
      - COLLECTIONS=crowdsecurity/traefik crowdsecurity/sshd crowdsecurity/http-cve
      - GID=1000
    volumes:
      - ./logs:/var/log/traefik:ro
      - /var/log/auth.log:/var/log/auth.log:ro
      - ./crowdsec/config:/etc/crowdsec
      - ./crowdsec/data:/var/lib/crowdsec/data
    networks:
      - proxy

networks:
  proxy:
    external: true # Réseau partagé par toutes tes futures apps
