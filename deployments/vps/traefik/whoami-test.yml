# Sample configuration to test Traefik auto-discovery & SSL binding
# Deploy with: docker compose -f whoami-test.yml up -d
# Verify by visiting: https://whoami.vps.fxhibon.fr
services:
  whoami:
    image: traefik/whoami:v1.10
    container_name: whoami-test
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      
      # Expose service on HTTPS under your subdomain
      - "traefik.http.routers.whoami.entrypoints=websecure"
      - "traefik.http.routers.whoami.rule=Host(`whoami.vps.fxhibon.fr`)"
      - "traefik.http.routers.whoami.tls=true"
      - "traefik.http.routers.whoami.tls.certresolver=myresolver"
      
      # Define the target container port (whoami listens on 80 by default)
      - "traefik.http.services.whoami.loadbalancer.server.port=80"

networks:
  proxy:
    external: true
