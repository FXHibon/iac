services:
  ###### - Entrypoint
  homepage:
    image: ghcr.io/gethomepage/homepage:v1.13.1
    container_name: homepage
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - ./homepage/config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=*
      - HOMEPAGE_VAR_PLEX_TOKEN=${PLEX_TOKEN}
      - HOMEPAGE_VAR_GRAFANA_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}

  ###### - Feeds

  transmission:
    image: haugene/transmission-openvpn:5.4.1
    container_name: transmission
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    volumes:
      - ./transmission/config:/config/transmission-home
      - /home/plex/Media/Movies:/data/completed
      - /home/plex/Media/incomplete:/data/incomplete
    environment:
      - PUID=1000
      - PGID=1000
      - OPENVPN_PROVIDER=PROTONVPN
      - OPENVPN_CONFIG=uk.protonvpn.udp,fr.protonvpn.udp,es.protonvpn.udp
      - OPENVPN_USERNAME=${TRANSMISSION_VPN_USERNAME}
      - OPENVPN_PASSWORD=${TRANSMISSION_VPN_PASSWORD}
      - LOCAL_NETWORK=192.168.1.0/24
      - TZ=Europe/Paris
    ports:
      - "9091:9091"

  ###### - Monitoring
  alertmanager:
    image: prom/alertmanager:v0.32.2
    container_name: alertmanager
    restart: unless-stopped
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - ./alertmanager/templates:/etc/alertmanager/templates
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    ports:
      - "9093:9093"

  prometheus:
    image: prom/prometheus:v3.12.0
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - "9090:9090"
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.11.1
    container_name: node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro1
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "9100:9100"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.0.2
    container_name: grafana
    ports:
      - "3000:3000"
    restart: unless-stopped
    user: "1000"
    volumes:
      - ./grafana:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
