global:
  resolve_timeout: 5m

templates:
  - '/etc/alertmanager/templates/*.tmpl'

route:
  receiver: 'telegram'
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: 'telegram'
    telegram_configs:
      - bot_token: 'REDACTED_TELEGRAM_TOKEN'
        chat_id: REDACTED_CHAT_ID
        send_resolved: true
        parse_mode: 'HTML'
        message: '{{ template "telegram.text" . }}'

