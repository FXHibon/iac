name: Reusable Docker Build & Push

# This event makes the workflow reusable by other repositories
on:
  workflow_call:
    secrets:
      dockerhub_username:
        description: 'Docker Hub username used for logging in'
        required: true
      dockerhub_token:
        description: 'Docker Hub Personal Access Token (PAT) used for authentication'
        required: true

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v6

      # Extract the caller repository's name (e.g. from "fxhibon/my-app" to "my-app")
      - name: Extract repository name
        id: repo-name
        run: |
          # shellcheck disable=SC2086
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          echo "name=${REPO_NAME}" >> $GITHUB_OUTPUT

      # QEMU is required to build for non-x86 architectures like ARM64 on x86 runners
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      # Set up Docker Buildx (which handles multi-platform builds and caching)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Log in to Docker Hub using the secrets passed by the caller workflow
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.dockerhub_username }}
          password: ${{ secrets.dockerhub_token }}

      # Extract metadata (tags, labels) for Docker images based on git events
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: fxhibon/${{ steps.repo-name.outputs.name }}
          # Generate tags based on git reference type:
          # 1. SemVer tags (e.g., 1.2.3, 1.2) if triggered on a git tag
          # 2. Branch name (e.g., master, dev)
          # 3. Full git commit SHA
          # 4. "latest" tag only for the default branch (usually master)
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,prefix=,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      # Build and push the image for both ARM64 and AMD64
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Speed up builds by caching layers to GitHub Actions runner
          cache-from: type=gha
          cache-to: type=gha,mode=max
