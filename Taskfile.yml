version: '3'

vars:
  ANSIBLE_DIR: 'infra/ansible'
  TOFU_DIR: 'infra/tofu/vps/ovh'

tasks:
  # ─── System Upgrades ──────────────────────────────────────────────────────────
  upgrade-vps:
    desc: "Update apt cache and upgrade all packages on the VPS"
    dir: "{{.ANSIBLE_DIR}}"
    cmds:
      - ansible vps -i inventory.ini -m apt -a "upgrade=safe update_cache=yes autoremove=yes" --become

  upgrade-rp5:
    desc: "Update apt cache and upgrade all packages on the Raspberry Pi"
    dir: "{{.ANSIBLE_DIR}}"
    cmds:
      - ansible raspberry -i inventory.ini -m apt -a "upgrade=safe update_cache=yes autoremove=yes" --become

  upgrade-all:
    desc: "Update and upgrade packages across all hosts (VPS + Raspberry Pi)"
    deps: [upgrade-vps, upgrade-rp5]

  # ─── Ansible Deployments ──────────────────────────────────────────────────────
  deploy-all:
    desc: "Deploy / update the entire infrastructure stack (VPS + Raspberry Pi)"
    dir: "{{.ANSIBLE_DIR}}"
    cmds:
      - ./deploy.sh

  deploy-vps:
    desc: "Deploy all applications on the VPS host group"
    dir: "{{.ANSIBLE_DIR}}"
    cmds:
      - ./deploy.sh --limit vps

  deploy-rp5:
    desc: "Deploy / update the home lab stack on the Raspberry Pi"
    dir: "{{.ANSIBLE_DIR}}"
    cmds:
      - ./deploy.sh --tags rp5

  deploy-traefik:
    desc: "Deploy / update Traefik reverse proxy only"
    dir: "{{.ANSIBLE_DIR}}"
    cmds:
      - ./deploy.sh --tags traefik

  deploy-monitoring:
    desc: "Deploy / update the Monitoring stack (Loki, Alloy, Prometheus, Grafana)"
    dir: "{{.ANSIBLE_DIR}}"
    cmds:
      - ./deploy.sh --tags monitoring

  deploy-fresh-fridge:
    desc: "Deploy / update the Fresh-Fridge application"
    dir: "{{.ANSIBLE_DIR}}"
    cmds:
      - ./deploy.sh --tags fresh-fridge

  deploy-poc-cms:
    desc: "Deploy / update the Poc-Cms application"
    dir: "{{.ANSIBLE_DIR}}"
    cmds:
      - ./deploy.sh --tags poc-cms

  deploy-running-pace-calculator:
    desc: "Deploy / update the Running Pace Calculator application"
    dir: "{{.ANSIBLE_DIR}}"
    cmds:
      - ./deploy.sh --tags running-pace-calculator

  deploy-square-collage-maker:
    desc: "Deploy / update the Square Collage Maker application"
    dir: "{{.ANSIBLE_DIR}}"
    cmds:
      - ./deploy.sh --tags square-collage-maker

  deploy-fxhibon-fr:
    desc: "Deploy / update the fxhibon.fr application"
    dir: "{{.ANSIBLE_DIR}}"
    cmds:
      - ./deploy.sh --tags fxhibon-fr

  deploy-stanne:
    desc: "Deploy / update the Stanne application"
    dir: "{{.ANSIBLE_DIR}}"
    cmds:
      - ./deploy.sh --tags stanne

  deploy-satisfactory:
    desc: "Deploy / update the Satisfactory Dedicated Server application"
    dir: "{{.ANSIBLE_DIR}}"
    cmds:
      - ./deploy.sh --tags satisfactory

  stop-satisfactory:
    desc: "Stop the Satisfactory Dedicated Server application"
    dir: "{{.ANSIBLE_DIR}}"
    cmds:
      - ./deploy.sh --tags satisfactory -e satisfactory_state=absent

  deploy-changed:
    desc: "Automatically detect and redeploy only the applications that changed since the last deployment"
    cmds:
      - bash ./scripts/deploy-changed.sh {{.CLI_ARGS}}

  deploy-changed-dry:
    desc: "Show what applications would be redeployed by the auto-deployment script (dry-run)"
    cmds:
      - bash ./scripts/deploy-changed.sh --dry-run {{.CLI_ARGS}}

  deploy-init-tag:
    desc: "Initialize or reset the 'deployed' git tag at the current commit"
    cmds:
      - git tag -f deployed HEAD
      - echo "Git tag 'deployed' initialized at $(git rev-parse --short HEAD)"



  # ─── OpenTofu Infrastructure ───────────────────────────────────────────────────
  tofu-init:
    desc: "Initialize OpenTofu working directory with S3 backend"
    dir: "{{.TOFU_DIR}}"
    vars: &tofu-vars
      AWS_ACCESS_KEY_ID:
        sh: sops -d --extract '["backend"]["s3_access_key_id"]' {{.TASKFILE_DIR}}/infra/tofu/secrets.yaml
      AWS_SECRET_ACCESS_KEY:
        sh: sops -d --extract '["backend"]["s3_secret_access_key"]' {{.TASKFILE_DIR}}/infra/tofu/secrets.yaml
    env: &tofu-env
      AWS_ACCESS_KEY_ID: "{{.AWS_ACCESS_KEY_ID}}"
      AWS_SECRET_ACCESS_KEY: "{{.AWS_SECRET_ACCESS_KEY}}"
    cmds:
      - tofu init

  tofu-plan:
    desc: "Generate and show the OpenTofu execution plan"
    dir: "{{.TOFU_DIR}}"
    vars: *tofu-vars
    env: *tofu-env
    cmds:
      - tofu plan

  tofu-apply:
    desc: "Build, change, or apply OpenTofu VPS infrastructure"
    dir: "{{.TOFU_DIR}}"
    vars: *tofu-vars
    env: *tofu-env
    cmds:
      - tofu apply

  tofu-fmt:
    desc: "Run OpenTofu formatter recursively on all configuration files"
    dir: "{{.TASKFILE_DIR}}/infra/tofu"
    cmds:
      - tofu fmt -recursive .

  # ─── OpenTofu Secrets Management ────────────────────────────────────────────────
  tofu-secrets-edit:
    desc: "Open OpenTofu secrets.yaml in your $EDITOR via sops"
    dir: "{{.TASKFILE_DIR}}/infra/tofu"
    cmds:
      - sops secrets.yaml

  tofu-secrets-decrypt:
    desc: "Decrypt OpenTofu secrets.yaml to stdout"
    dir: "{{.TASKFILE_DIR}}/infra/tofu"
    cmds:
      - sops -d secrets.yaml

  tofu-secrets-encrypt:
    desc: "Encrypt a file in-place using sops + age (use: task tofu-secrets-encrypt FILE=<path>)"
    dir: "{{.TASKFILE_DIR}}/infra/tofu"
    requires:
      vars: [FILE]
    cmds:
      - sops --encrypt --in-place "{{.FILE}}"

  # ─── Diagnostics & Logs ────────────────────────────────────────────────────────
  vps-status:
    desc: "List all running containers on the VPS host"
    cmds:
      - ssh vps docker ps

  vps-logs:
    desc: "Follow the logs of a container on the VPS (use: task vps-logs container=<name>)"
    requires:
      vars: [container]
    cmds:
      - ssh vps docker logs -f {{.container}}

  # ─── Secrets Management ────────────────────────────────────────────────────────
  decrypt-secrets:
    desc: "Decrypt Ansible secrets file for manual editing or review"
    dir: "{{.ANSIBLE_DIR}}"
    cmds:
      - sops -d secrets.enc.yaml > secrets.decrypted.yaml
    sources:
      - secrets.enc.yaml
    generates:
      - secrets.decrypted.yaml

  encrypt-secrets:
    desc: "Encrypt manual edits back into secrets.enc.yaml and clean up local file"
    dir: "{{.ANSIBLE_DIR}}"
    cmds:
      - sops -e secrets.decrypted.yaml > secrets.enc.yaml
      - rm secrets.decrypted.yaml

  # ─── Dependency Management ──────────────────────────────────────────────────
  renovate-check:
    desc: "Scan repository and show available updates (dry-run/lookup only)"
    vars: &renovate-vars
      DOCKER_USERNAME:
        sh: sops -d --extract '["docker_username"]' {{.TASKFILE_DIR}}/infra/ansible/secrets.enc.yaml
      DOCKER_PASSWORD:
        sh: sops -d --extract '["docker_password"]' {{.TASKFILE_DIR}}/infra/ansible/secrets.enc.yaml
      LOG_LEVEL: '{{.LOG_LEVEL | default "info"}}'
    env: &renovate-env
      RENOVATE_HOST_RULES: '[{"hostType": "docker", "matchHost": "docker.io", "username": "{{.DOCKER_USERNAME}}", "password": "{{.DOCKER_PASSWORD}}"}]'
      LOG_LEVEL: '{{.LOG_LEVEL}}'
    cmds:
      - docker run --rm -v "{{.TASKFILE_DIR}}:/usr/src/app" -e LOG_LEVEL -e RENOVATE_PLATFORM=local -e RENOVATE_HOST_RULES -e GITHUB_COM_TOKEN="${GITHUB_TOKEN}" renovate/renovate --onboarding=false --dry-run=lookup

  renovate-apply:
    desc: "Scan repository and create Pull Requests on GitHub for version updates"
    vars: *renovate-vars
    env: *renovate-env
    cmds:
      - docker run --rm -e LOG_LEVEL -e RENOVATE_PLATFORM=github -e RENOVATE_TOKEN="${GITHUB_TOKEN}" -e RENOVATE_HOST_RULES -e GITHUB_COM_TOKEN="${GITHUB_TOKEN}" renovate/renovate --onboarding=false FXHibon/iac

  # ─── Linting & Security ───────────────────────────────────────────────────────
  lint-iac:
    desc: "Scan IaC configurations (OpenTofu, Ansible, Compose) for security issues using Checkov"
    cmds:
      - docker run --rm -v "{{.TASKFILE_DIR}}:/tf" bridgecrew/checkov -d /tf --framework terraform,ansible,yaml
