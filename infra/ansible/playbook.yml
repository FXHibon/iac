    # ── Satisfactory Dedicated Server Deployment ───────────────────────────────

    - name: Ensure satisfactory directories exist
      ansible.builtin.file:
        path: "/home/debian/apps/satisfactory/{{ item }}"
        state: directory
        owner: debian
        group: debian
        mode: "0755"
      loop:
        - ""
        - "data"
      tags: satisfactory

    - name: Copy satisfactory docker-compose
