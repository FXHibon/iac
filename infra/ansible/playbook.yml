---
- name: Bootstrap OVH VPS
  hosts: vps
  become: true

  tasks:
    # ── System ────────────────────────────────────────────────────────────────

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install base packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - ufw
          - fail2ban
          - jq
          - geoip-bin
          - neovim
        state: present

    # ── Hostname ──────────────────────────────────────────────────────────────

    - name: Set hostname
      ansible.builtin.hostname:
        name: vps.fxhibon.fr

    # ── SSH hardening ─────────────────────────────────────────────────────────

    - name: Configure sshd
      ansible.builtin.blockinfile:
        path: /etc/ssh/sshd_config.d/99-hardening.conf
        create: true
        mode: "0600"
        block: |
          PermitRootLogin no
          PasswordAuthentication no
          PubkeyAuthentication yes
          AuthorizedKeysFile .ssh/authorized_keys
          PermitEmptyPasswords no
          ChallengeResponseAuthentication no
          X11Forwarding no
          AllowTcpForwarding no
          MaxAuthTries 3
          LoginGraceTime 30
      notify: Restart sshd

    # ── Fail2Ban ──────────────────────────────────────────────────────────────

    - name: Configure Fail2Ban jail for SSH
      ansible.builtin.copy:
        dest: /etc/fail2ban/jail.d/sshd.conf
        mode: "0644"
        content: |
          [sshd]
          enabled  = true
          port     = ssh
          filter   = sshd
          backend  = systemd
          maxretry = 5
          bantime  = 1h
          findtime = 10m
      notify: Restart fail2ban

    - name: Enable and start Fail2Ban
      ansible.builtin.service:
        name: fail2ban
        state: started
        enabled: true

    # ── Firewall ──────────────────────────────────────────────────────────────

    - name: Allow SSH
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp

    - name: Allow HTTP
      community.general.ufw:
        rule: allow
        port: "80"
        proto: tcp

    - name: Allow HTTPS
      community.general.ufw:
        rule: allow
        port: "443"
        proto: tcp

    - name: Enable UFW (default deny)
      community.general.ufw:
        state: enabled
        policy: deny

    # ── Docker ────────────────────────────────────────────────────────────────

    - name: Create Docker keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/debian/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker apt repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/debian
          {{ ansible_distribution_release }} stable
        filename: docker
        state: present

    - name: Install Docker Engine and Compose plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
          - neovim
        state: present
        update_cache: true

    - name: Enable and start Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Add debian user to docker group
      ansible.builtin.user:
        name: debian
        groups: docker
        append: true

    - name: Log into Docker Hub
      community.docker.docker_login:
        username: "{{ docker_username }}"
        password: "{{ docker_password }}"
        state: present
      become: false
      tags: docker

    # ── Traefik Deployment ─────────────────────────────────────────────────────

    - name: Create proxy Docker network
      community.docker.docker_network:
        name: proxy
        state: present
      tags: traefik

    - name: Ensure app directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: debian
        group: debian
        mode: "0755"
      loop:
        - /home/debian/apps
        - /home/debian/apps/traefik
        - /home/debian/apps/traefik/data
        - /home/debian/apps/traefik/logs
        - /home/debian/apps/traefik/crowdsec
        - /home/debian/apps/traefik/crowdsec/config
        - /home/debian/apps/traefik/crowdsec/data
      tags: traefik

    - name: Copy Traefik configuration files
      ansible.builtin.copy:
        src: "../../deployments/vps/traefik/{{ item.src }}"
        dest: "/home/debian/apps/traefik/{{ item.dest }}"
        owner: debian
        group: debian
        mode: "{{ item.mode }}"
      loop:
        - { src: "docker-compose.yml", dest: "docker-compose.yml", mode: "0644" }
        - { src: "data/traefik.yml", dest: "data/traefik.yml", mode: "0644" }
      tags: traefik

    - name: Create CrowdSec acquis.yaml configuration
      ansible.builtin.copy:
        dest: /home/debian/apps/traefik/crowdsec/acquis.yaml
        owner: debian
        group: debian
        mode: "0644"
        content: |
          filenames:
            - /var/log/traefik/access.log
          labels:
            type: traefik
          ---
          filenames:
            - /var/log/auth.log
          labels:
            type: syslog
      tags: traefik

    - name: Ensure acme.json exists with correct permissions
      ansible.builtin.file:
        path: /home/debian/apps/traefik/data/acme.json
        state: touch
        owner: debian
        group: debian
        mode: "0600"
        modification_time: preserve
        access_time: preserve
      tags: traefik

    - name: Ensure access.log exists with correct permissions
      ansible.builtin.file:
        path: /home/debian/apps/traefik/logs/access.log
        state: touch
        owner: debian
        group: debian
        mode: "0644"
        modification_time: preserve
        access_time: preserve
      tags: traefik

    - name: Check if Traefik .env file exists
      ansible.builtin.stat:
        path: /home/debian/apps/traefik/.env
      register: traefik_env_file
      tags: traefik

    - name: Create Traefik .env file with placeholder if it doesn't exist
      ansible.builtin.copy:
        dest: /home/debian/apps/traefik/.env
        content: "CROWDSEC_BOUNCER_KEY=placeholder_setup\n"
        owner: debian
        group: debian
        mode: "0600"
      when: not traefik_env_file.stat.exists
      tags: traefik

    - name: Dynamic CrowdSec Bouncer Key Generation and Registration
      ansible.builtin.shell: |
        set -e
        # 1. Check if we already have a real key (not placeholder)
        if [ -f /home/debian/apps/traefik/.env ] && grep -q "CROWDSEC_BOUNCER_KEY=" /home/debian/apps/traefik/.env && ! grep -q "placeholder_setup" /home/debian/apps/traefik/.env; then
            echo "Bouncer key already set in .env"
            exit 0
        fi

        # 2. Start only the crowdsec service first to register the bouncer
        docker compose -f /home/debian/apps/traefik/docker-compose.yml up -d crowdsec

        # 3. Wait for crowdsec to be ready and database to initialize
        for i in {1..15}; do
            if docker exec crowdsec cscli bouncers list >/dev/null 2>&1; then
                break
            fi
            sleep 2
        done

        # 4. Check if bouncer already exists in CrowdSec database, delete it if so
        if docker exec crowdsec cscli bouncers list | grep -q "traefik-bouncer"; then
            docker exec crowdsec cscli bouncers delete traefik-bouncer
        fi

        # 5. Generate a new raw bouncer key
        KEY=$(docker exec crowdsec cscli bouncers add traefik-bouncer -o raw)

        # 6. Save key to .env file
        echo "CROWDSEC_BOUNCER_KEY=$KEY" > /home/debian/apps/traefik/.env
        chmod 0600 /home/debian/apps/traefik/.env
        chown debian:debian /home/debian/apps/traefik/.env
        echo "Successfully generated and saved CrowdSec bouncer key"
      register: crowdsec_key_generation
      changed_when: "'Successfully generated' in crowdsec_key_generation.stdout"
      tags: traefik

    - name: Start Traefik via Docker Compose
      community.docker.docker_compose_v2:
        project_src: /home/debian/apps/traefik
        state: present
        pull: always
        recreate: always
        remove_orphans: true
      tags: traefik

    # ── Monitoring Deployment ──────────────────────────────────────────────────

    - name: Ensure monitoring directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: debian
        group: debian
        mode: "0755"
      loop:
        - /home/debian/apps/monitoring
        - /home/debian/apps/monitoring/config
        - /home/debian/apps/monitoring/config/grafana
        - /home/debian/apps/monitoring/config/grafana/provisioning
        - /home/debian/apps/monitoring/config/grafana/provisioning/datasources
        - /home/debian/apps/monitoring/config/grafana/provisioning/dashboards
        - /home/debian/apps/monitoring/config/loki
        - /home/debian/apps/monitoring/config/alloy
        - /home/debian/apps/monitoring/dashboards
        - /home/debian/apps/monitoring/prometheus-data
        - /home/debian/apps/monitoring/grafana-data
        - /home/debian/apps/monitoring/loki-data
      tags: monitoring

    - name: Copy Monitoring configuration files
      ansible.builtin.copy:
        src: "../../deployments/vps/monitoring/{{ item.src }}"
        dest: "/home/debian/apps/monitoring/{{ item.dest }}"
        owner: debian
        group: debian
        mode: "{{ item.mode }}"
      loop:
        - { src: "docker-compose.yml", dest: "docker-compose.yml", mode: "0644" }
        - { src: "config/prometheus.yml", dest: "config/prometheus.yml", mode: "0644" }
        - { src: "config/grafana/provisioning/datasources/datasource.yml", dest: "config/grafana/provisioning/datasources/datasource.yml", mode: "0644" }
        - { src: "config/grafana/provisioning/dashboards/dashboard.yml", dest: "config/grafana/provisioning/dashboards/dashboard.yml", mode: "0644" }
        - { src: "dashboards/docker-containers.json", dest: "dashboards/docker-containers.json", mode: "0644" }
        - { src: "config/loki/loki.yml", dest: "config/loki/loki.yml", mode: "0644" }
        - { src: "config/alloy/config.alloy", dest: "config/alloy/config.alloy", mode: "0644" }
      tags: monitoring

    - name: Start Monitoring via Docker Compose
      community.docker.docker_compose_v2:
        project_src: /home/debian/apps/monitoring
        state: present
        pull: always
        recreate: always
        remove_orphans: true
      tags: monitoring

    # ── Fresh-Fridge Deployment ────────────────────────────────────────────────

    - name: Ensure fresh-fridge directories exist
      ansible.builtin.file:
        path: /home/debian/apps/fresh-fridge
        state: directory
        owner: debian
        group: debian
        mode: "0755"
      tags: fresh-fridge

    - name: Copy fresh-fridge docker-compose
      ansible.builtin.copy:
        src: ../../deployments/vps/fresh-fridge/docker-compose.yml
        dest: /home/debian/apps/fresh-fridge/docker-compose.yml
        owner: debian
        group: debian
        mode: "0644"
      tags: fresh-fridge

    - name: Create fresh-fridge .env file
      ansible.builtin.copy:
        dest: /home/debian/apps/fresh-fridge/.env
        content: "GEMINI_API_KEY={{ fresh_fridge_gemini_api_key }}\n"
        owner: debian
        group: debian
        mode: "0600"
      tags: fresh-fridge

    - name: Start fresh-fridge via Docker Compose
      community.docker.docker_compose_v2:
        project_src: /home/debian/apps/fresh-fridge
        state: present
        pull: always
        recreate: always
        remove_orphans: true
      become: false
      tags: fresh-fridge

  handlers:
    - name: Restart sshd
      ansible.builtin.service:
        name: sshd
        state: restarted

    - name: Restart fail2ban
      ansible.builtin.service:
        name: fail2ban
        state: restarted

- name: Bootstrap Raspberry Pi
  hosts: raspberry
  become: true

  tasks:
    # ── System ────────────────────────────────────────────────────────────────

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install base packages
      ansible.builtin.apt:
        name:
          - fail2ban
          - ufw
          - jq
          - geoip-bin
        state: present

    # ── SSH hardening ─────────────────────────────────────────────────────────

    - name: Configure sshd
      ansible.builtin.blockinfile:
        path: /etc/ssh/sshd_config.d/99-hardening.conf
        create: true
        mode: "0600"
        block: |
          PermitRootLogin no
          PasswordAuthentication no
          PubkeyAuthentication yes
          AuthorizedKeysFile .ssh/authorized_keys
          PermitEmptyPasswords no
          ChallengeResponseAuthentication no
          X11Forwarding no
          AllowTcpForwarding no
          MaxAuthTries 3
          LoginGraceTime 30
      notify: Restart sshd

    # ── Fail2Ban ──────────────────────────────────────────────────────────────

    - name: Configure Fail2Ban jail for SSH
      tags: fail2ban
      ansible.builtin.copy:
        dest: /etc/fail2ban/jail.d/sshd.conf
        mode: "0644"
        content: |
          [sshd]
          backend=systemd
          enabled  = true
          port     = ssh
          filter   = sshd
          maxretry = 5
          bantime  = 1h
          findtime = 10m
      notify: Restart fail2ban

    - name: Enable and start Fail2Ban
      tags: fail2ban
      ansible.builtin.service:
        name: fail2ban
        state: started
        enabled: true

    # ── RP5 Stack Deployment ───────────────────────────────────────────────────

    - name: Ensure apps directory exists on RP5
      ansible.builtin.file:
        path: /home/fxhibon/apps
        state: directory
        owner: fxhibon
        group: fxhibon
        mode: "0755"
      tags: rp5

    - name: Copy RP5 docker stack files
      ansible.builtin.copy:
        src: ../../deployments/rp5/
        dest: /home/fxhibon/apps/
        owner: fxhibon
        group: fxhibon
        mode: "0755"
      tags: rp5

    - name: Start RP5 Docker stack
      community.docker.docker_compose_v2:
        project_src: /home/fxhibon/apps
        state: present
        pull: always
        recreate: always
        remove_orphans: true
      tags: rp5

  handlers:
    - name: Restart sshd
      ansible.builtin.service:
        name: sshd
        state: restarted

    - name: Restart fail2ban
      ansible.builtin.service:
        name: fail2ban
        state: restarted
