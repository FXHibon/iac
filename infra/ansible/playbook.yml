---
- name: Bootstrap OVH VPS
  hosts: vps
  become: true

  tasks:
    # ── System ────────────────────────────────────────────────────────────────

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install base packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - ufw
          - fail2ban
          - jq
          - geoip-bin
          - neovim
        state: present

    # ── Hostname ──────────────────────────────────────────────────────────────

    - name: Set hostname
      ansible.builtin.hostname:
        name: vps.fxhibon.fr

    # ── SSH hardening ─────────────────────────────────────────────────────────

    - name: Configure sshd
      ansible.builtin.blockinfile:
        path: /etc/ssh/sshd_config.d/99-hardening.conf
        create: true
        mode: "0600"
        block: |
          PermitRootLogin no
          PasswordAuthentication no
          PubkeyAuthentication yes
          AuthorizedKeysFile .ssh/authorized_keys
          PermitEmptyPasswords no
          ChallengeResponseAuthentication no
          X11Forwarding no
          AllowTcpForwarding no
          MaxAuthTries 3
          LoginGraceTime 30
      notify: Restart sshd

    # ── Fail2Ban ──────────────────────────────────────────────────────────────

    - name: Configure Fail2Ban jail for SSH
      ansible.builtin.copy:
        dest: /etc/fail2ban/jail.d/sshd.conf
        mode: "0644"
        content: |
          [sshd]
          enabled  = true
          port     = ssh
          filter   = sshd
          backend  = systemd
          maxretry = 5
          bantime  = 1h
          findtime = 10m
      notify: Restart fail2ban

    - name: Enable and start Fail2Ban
      ansible.builtin.service:
        name: fail2ban
        state: started
        enabled: true

    # ── Firewall ──────────────────────────────────────────────────────────────

    - name: Allow SSH
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp

    - name: Allow HTTP
      community.general.ufw:
        rule: allow
        port: "80"
        proto: tcp

    - name: Allow HTTPS
      community.general.ufw:
        rule: allow
        port: "443"
        proto: tcp

    - name: Enable UFW (default deny)
      community.general.ufw:
        state: enabled
        policy: deny

    # ── Docker ────────────────────────────────────────────────────────────────

    - name: Create Docker keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/debian/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker apt repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/debian
          {{ ansible_distribution_release }} stable
        filename: docker
        state: present

    - name: Install Docker Engine and Compose plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
          - neovim
        state: present
        update_cache: true

    - name: Enable and start Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Add debian user to docker group
      ansible.builtin.user:
        name: debian
        groups: docker
        append: true

    - name: Log into Docker Hub
      community.docker.docker_login:
        username: "{{ docker_username }}"
        password: "{{ docker_password }}"
        state: present
      become: false
      tags: docker

    # ── Traefik Deployment ─────────────────────────────────────────────────────

    - name: Create proxy Docker network
      community.docker.docker_network:
        name: proxy
        state: present
      tags: traefik

    - name: Ensure app directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: debian
        group: debian
        mode: "0755"
      loop:
        - /home/debian/apps
        - /home/debian/apps/traefik
        - /home/debian/apps/traefik/data
      tags: traefik

    - name: Copy Traefik configuration files
      ansible.builtin.copy:
        src: "../../deployments/vps/traefik/{{ item.src }}"
        dest: "/home/debian/apps/traefik/{{ item.dest }}"
        owner: debian
        group: debian
        mode: "{{ item.mode }}"
      loop:
        - { src: "docker-compose.yml", dest: "docker-compose.yml", mode: "0644" }
        - { src: "data/traefik.yml", dest: "data/traefik.yml", mode: "0644" }
      tags: traefik

    - name: Ensure acme.json exists with correct permissions
      ansible.builtin.file:
        path: /home/debian/apps/traefik/data/acme.json
        state: touch
        owner: debian
        group: debian
        mode: "0600"
        modification_time: preserve
        access_time: preserve
      tags: traefik

    - name: Start Traefik via Docker Compose
      community.docker.docker_compose_v2:
        project_src: /home/debian/apps/traefik
        state: present
        pull: always
        recreate: always
        remove_orphans: true
      tags: traefik

    # ── Monitoring Deployment ──────────────────────────────────────────────────

    - name: Ensure monitoring directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: debian
        group: debian
        mode: "0755"
      loop:
        - /home/debian/apps/monitoring
        - /home/debian/apps/monitoring/config
        - /home/debian/apps/monitoring/config/grafana
        - /home/debian/apps/monitoring/config/grafana/provisioning
        - /home/debian/apps/monitoring/config/grafana/provisioning/datasources
        - /home/debian/apps/monitoring/config/grafana/provisioning/dashboards
        - /home/debian/apps/monitoring/dashboards
        - /home/debian/apps/monitoring/prometheus-data
        - /home/debian/apps/monitoring/grafana-data
      tags: monitoring

    - name: Copy Monitoring configuration files
      ansible.builtin.copy:
        src: "../../deployments/vps/monitoring/{{ item.src }}"
        dest: "/home/debian/apps/monitoring/{{ item.dest }}"
        owner: debian
        group: debian
        mode: "{{ item.mode }}"
      loop:
        - { src: "docker-compose.yml", dest: "docker-compose.yml", mode: "0644" }
        - { src: "config/prometheus.yml", dest: "config/prometheus.yml", mode: "0644" }
        - { src: "config/grafana/provisioning/datasources/datasource.yml", dest: "config/grafana/provisioning/datasources/datasource.yml", mode: "0644" }
        - { src: "config/grafana/provisioning/dashboards/dashboard.yml", dest: "config/grafana/provisioning/dashboards/dashboard.yml", mode: "0644" }
      tags: monitoring

    - name: Start Monitoring via Docker Compose
      community.docker.docker_compose_v2:
        project_src: /home/debian/apps/monitoring
        state: present
        pull: always
        recreate: always
        remove_orphans: true
      tags: monitoring

    # ── Fresh-Fridge Deployment ────────────────────────────────────────────────

    - name: Ensure fresh-fridge directories exist
      ansible.builtin.file:
        path: /home/debian/apps/fresh-fridge
        state: directory
        owner: debian
        group: debian
        mode: "0755"
      tags: fresh-fridge

    - name: Copy fresh-fridge docker-compose
      ansible.builtin.copy:
        src: ../../deployments/vps/fresh-fridge/docker-compose.yml
        dest: /home/debian/apps/fresh-fridge/docker-compose.yml
        owner: debian
        group: debian
        mode: "0644"
      tags: fresh-fridge

    - name: Create fresh-fridge .env file
      ansible.builtin.copy:
        dest: /home/debian/apps/fresh-fridge/.env
        content: "GEMINI_API_KEY={{ fresh_fridge_gemini_api_key }}\n"
        owner: debian
        group: debian
        mode: "0600"
      tags: fresh-fridge

    - name: Start fresh-fridge via Docker Compose
      community.docker.docker_compose_v2:
        project_src: /home/debian/apps/fresh-fridge
        state: present
        pull: always
        recreate: always
        remove_orphans: true
      become: false
      tags: fresh-fridge

  handlers:
    - name: Restart sshd
      ansible.builtin.service:
        name: sshd
        state: restarted

    - name: Restart fail2ban
      ansible.builtin.service:
        name: fail2ban
        state: restarted

- name: Bootstrap Raspberry Pi
  hosts: raspberry
  become: true

  tasks:
    # ── System ────────────────────────────────────────────────────────────────

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install base packages
      ansible.builtin.apt:
        name:
          - fail2ban
          - ufw
          - jq
          - geoip-bin
        state: present

    # ── SSH hardening ─────────────────────────────────────────────────────────

    - name: Configure sshd
      ansible.builtin.blockinfile:
        path: /etc/ssh/sshd_config.d/99-hardening.conf
        create: true
        mode: "0600"
        block: |
          PermitRootLogin no
          PasswordAuthentication no
          PubkeyAuthentication yes
          AuthorizedKeysFile .ssh/authorized_keys
          PermitEmptyPasswords no
          ChallengeResponseAuthentication no
          X11Forwarding no
          AllowTcpForwarding no
          MaxAuthTries 3
          LoginGraceTime 30
      notify: Restart sshd

    # ── Fail2Ban ──────────────────────────────────────────────────────────────

    - name: Configure Fail2Ban jail for SSH
      tags: fail2ban
      ansible.builtin.copy:
        dest: /etc/fail2ban/jail.d/sshd.conf
        mode: "0644"
        content: |
          [sshd]
          backend=systemd
          enabled  = true
          port     = ssh
          filter   = sshd
          maxretry = 5
          bantime  = 1h
          findtime = 10m
      notify: Restart fail2ban

    - name: Enable and start Fail2Ban
      tags: fail2ban
      ansible.builtin.service:
        name: fail2ban
        state: started
        enabled: true

    # ── RP5 Stack Deployment ───────────────────────────────────────────────────

    - name: Ensure apps directory exists on RP5
      ansible.builtin.file:
        path: /home/fxhibon/apps
        state: directory
        owner: fxhibon
        group: fxhibon
        mode: "0755"
      tags: rp5

    - name: Copy RP5 docker stack files
      ansible.builtin.copy:
        src: ../../deployments/rp5/
        dest: /home/fxhibon/apps/
        owner: fxhibon
        group: fxhibon
        mode: "0755"
      tags: rp5

    - name: Start RP5 Docker stack
      community.docker.docker_compose_v2:
        project_src: /home/fxhibon/apps
        state: present
        pull: always
        recreate: always
        remove_orphans: true
      tags: rp5

  handlers:
    - name: Restart sshd
      ansible.builtin.service:
        name: sshd
        state: restarted

    - name: Restart fail2ban
      ansible.builtin.service:
        name: fail2ban
        state: restarted
