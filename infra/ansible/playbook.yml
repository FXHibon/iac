  handlers:
    - name: Restart sshd
      ansible.builtin.service:
        name: sshd
        state: restarted

    - name: Restart fail2ban
      ansible.builtin.service:
        name: fail2ban
        state: restarted

- name: Bootstrap Raspberry Pi
  hosts: raspberry
  become: true

  tasks:
    # ── System ────────────────────────────────────────────────────────────────

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install base packages
      ansible.builtin.apt:
        name:
          - fail2ban
          - ufw
          - jq
          - geoip-bin
          - tree
          - neovim
        state: present

    # ── SSH hardening ─────────────────────────────────────────────────────────

    - name: Configure sshd
      ansible.builtin.blockinfile:
        path: /etc/ssh/sshd_config.d/99-hardening.conf
        create: true
        mode: "0600"
        block: |
          PermitRootLogin no
          PasswordAuthentication no
          PubkeyAuthentication yes
          AuthorizedKeysFile .ssh/authorized_keys
          PermitEmptyPasswords no
          ChallengeResponseAuthentication no
          X11Forwarding no
          AllowTcpForwarding no
          MaxAuthTries 3
          LoginGraceTime 30
      notify: Restart sshd

    # ── Fail2Ban ──────────────────────────────────────────────────────────────

    - name: Configure Fail2Ban jail for SSH
      tags: fail2ban
      ansible.builtin.copy:
        dest: /etc/fail2ban/jail.d/sshd.conf
        mode: "0644"
        content: |
          [sshd]
          backend=systemd
          enabled  = true
          port     = ssh
          filter   = sshd
          maxretry = 5
          bantime  = 1h
          findtime = 10m
      notify: Restart fail2ban

    - name: Enable and start Fail2Ban
      tags: fail2ban
      ansible.builtin.service:
        name: fail2ban
        state: started
        enabled: true

    # ── RP5 Stack Deployment ───────────────────────────────────────────────────

    - name: Ensure apps directory exists on RP5
      ansible.builtin.file:
        path: /home/fxhibon/apps
        state: directory
        owner: fxhibon
        group: fxhibon
        mode: "0755"
      tags: rp5

    - name: Copy RP5 docker stack files
      ansible.builtin.copy:
        src: ../../deployments/rp5/
        dest: /home/fxhibon/apps/
        owner: fxhibon
        group: fxhibon
        mode: "0755"
      tags: rp5

    - name: Template Alertmanager configuration
      ansible.builtin.template:
        src: ../../deployments/rp5/alertmanager/alertmanager.yml.j2
        dest: /home/fxhibon/apps/alertmanager/alertmanager.yml
        owner: fxhibon
        group: fxhibon
        mode: "0600"
      tags: rp5

    - name: Create RP5 .env file
      ansible.builtin.copy:
        dest: /home/fxhibon/apps/.env
        content: |
          TRANSMISSION_VPN_USERNAME={{ transmission_vpn_username }}
          TRANSMISSION_VPN_PASSWORD={{ transmission_vpn_password }}
          PLEX_TOKEN={{ plex_token }}
          GF_SECURITY_ADMIN_PASSWORD={{ rp5_grafana_admin_password }}
        owner: fxhibon
        group: fxhibon
        mode: "0600"
      tags: rp5

    - name: Start RP5 Docker stack
      community.docker.docker_compose_v2:
        project_src: /home/fxhibon/apps
        state: present
        pull: always
        recreate: auto
        remove_orphans: true
      tags: rp5

  handlers:
    - name: Restart sshd
      ansible.builtin.service:
        name: sshd
        state: restarted

    - name: Restart fail2ban
      ansible.builtin.service:
        name: fail2ban
        state: restarted
