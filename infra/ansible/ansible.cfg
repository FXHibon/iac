[defaults]
inventory = inventory.ini
remote_user = debian
private_key_file = ~/.ssh/id_ovh_vps
host_key_checking = False
interpreter_python = auto_silent
# Performance optimizations
forks = 20
gathering = smart
fact_caching = jsonfile
fact_caching_connection = ./.ansible_fact_cache
fact_caching_timeout = 86400

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=30m -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=30

